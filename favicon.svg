<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b362c" />
      <stop offset="50%" stop-color="#2b4c3f" />
      <stop offset="100%" stop-color="#142820" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="40%" stop-color="#d4a338" />
      <stop offset="100%" stop-color="#8a5a12" />
    </linearGradient>

    <!-- Warm Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4eedf" />
    </linearGradient>

    <!-- Drop Shadow for Tiles -->
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Inner Subtle Texture Border -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Central Emblem: Crossword / Word Grid Composition -->
  <g filter="url(#iconGlow)">
    <!-- 3x3 Crossword Puzzle Cluster -->
    <!-- Row 1 -->
    <!-- Cell (0,0) - Letter A -->
    <rect x="88" y="88" width="104" height="104" rx="18" fill="url(#paperGrad)" stroke="#c26d38" stroke-width="4" filter="url(#tileShadow)" />
    <text x="140" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#2b4c3f" text-anchor="middle">A</text>

    <!-- Cell (0,1) - Filled Block with Star -->
    <rect x="204" y="88" width="104" height="104" rx="18" fill="url(#goldGrad)" stroke="#8a5a12" stroke-width="3" filter="url(#tileShadow)" />
    <polygon points="256,118 266,144 294,144 271,160 280,186 256,170 232,186 241,160 218,144 246,144" fill="#ffffff" opacity="0.95" />

    <!-- Cell (0,2) - Letter L -->
    <rect x="320" y="88" width="104" height="104" rx="18" fill="url(#paperGrad)" stroke="#c26d38" stroke-width="4" filter="url(#tileShadow)" />
    <text x="372" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#2b4c3f" text-anchor="middle">L</text>

    <!-- Row 2 -->
    <!-- Cell (1,0) - Filled Block Accent -->
    <rect x="88" y="204" width="104" height="104" rx="18" fill="#1e382e" stroke="url(#goldGrad)" stroke-width="3" filter="url(#tileShadow)" />
    <circle cx="140" cy="256" r="18" fill="url(#goldGrad)" opacity="0.8" />

    <!-- Cell (1,1) - Centerpiece Letter M -->
    <rect x="204" y="204" width="104" height="104" rx="18" fill="url(#paperGrad)" stroke="#c26d38" stroke-width="5" filter="url(#tileShadow)" />
    <text x="256" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="900" fill="#c26d38" text-anchor="middle">M</text>

    <!-- Cell (1,2) - Highlighted Found Cell -->
    <rect x="320" y="204" width="104" height="104" rx="18" fill="#257a4b" stroke="#ffffff" stroke-width="3" filter="url(#tileShadow)" />
    <text x="372" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>

    <!-- Row 3 -->
    <!-- Cell (2,0) - Letter Z -->
    <rect x="88" y="320" width="104" height="104" rx="18" fill="url(#paperGrad)" stroke="#c26d38" stroke-width="4" filter="url(#tileShadow)" />
    <text x="140" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#2b4c3f" text-anchor="middle">Z</text>

    <!-- Cell (2,1) - Letter A -->
    <rect x="204" y="320" width="104" height="104" rx="18" fill="url(#paperGrad)" stroke="#c26d38" stroke-width="4" filter="url(#tileShadow)" />
    <text x="256" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#2b4c3f" text-anchor="middle">A</text>

    <!-- Cell (2,2) - Pencil / Quill Symbol -->
    <rect x="320" y="320" width="104" height="104" rx="18" fill="url(#paperGrad)" stroke="#c26d38" stroke-width="4" filter="url(#tileShadow)" />
    <text x="372" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#b8831c" text-anchor="middle">✏️</text>
  </g>

  <!-- Golden Magnifying Glass Across Diagonal -->
  <g transform="translate(24, 24)" filter="url(#tileShadow)">
    <circle cx="340" cy="340" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    <circle cx="340" cy="340" r="40" fill="#ffffff" fill-opacity="0.16" />
    <line x1="375" y1="375" x2="435" y2="435" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M 320 320 A 24 24 0 0 1 356 320" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>
